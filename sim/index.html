  };

  const byEvCons = (a, b) => b.evCons - a.evCons;
  const fk = (p, odds) => { const f = (p * odds - 1) / (odds - 1); return f > 0 ? f : 0; };

  /* matches: records from SC.run (or restored). o: {mode: 'prob' | 'value', minEdge, bankroll, profile, en:{goals,cards,corners,combos,parlay}}
     mode 'prob' (default): most probable realistic bets, edge only has to be >= minEdge (default 0) and not absurdly high (see SC.PROB);
     mode 'value': the old ranking by conservative edge. */
  SC.compile = function (matches, o) {
    o = Object.assign({ mode: 'prob', bankroll: 300, profile: 'bal', perMatch: 2, minLegP: 0.35, minCompl: 0.4 }, o || {});
    if (o.mode !== 'value') o.mode = 'prob';
    if (!(o.minEdge >= 0)) o.minEdge = o.mode === 'prob' ? 0 : 0.03;
    o.en = Object.assign({ goals: true, cards: true, corners: true, combos: true, parlay: true }, o.en || {});
    // user filters: minimum probability, price window (singles >= 1.30, parlay legs >= 1.40 always), leagues switched off
    o.minP = o.minP == null || o.minP === '' || !isFinite(Number(o.minP)) ? null : Math.min(0.95, Math.max(0, Number(o.minP)));
    o.oMin = Math.max(SC.MIN_SINGLE, Number(o.oMin) || SC.MIN_SINGLE);
    o.oMax = Number(o.oMax) >= o.oMin ? Number(o.oMax) : 3.5;
    const lgOff = new Set(o.lgOff || []);
    const keyOn = (key) => { const k = SC.mktOf(key); if (!k) return true; if (GOAL_MKT[k] && o.en.goals === false) return false; return o.en[k] !== false; };
    const PB = o.mode === 'prob', P = SC.PROB, mp = o.minP != null ? o.minP : (PB ? P.minP : 0);
    const score = PB ? (r) => r.pCons : (r) => r.evCons;                       // ranking key of singles / legs
    const bySc = (a, b) => score(b) - score(a);
    const ok = matches.filter((m) => m.status === 'ok' && !m.noOdds && !lgOff.has(m.fix.league.id));
    const tag = (r, m) => Object.assign({}, r, { mid: m.fix.id, ts: m.fix.ts, match: `${m.fix.home.name} – ${m.fix.away.name}`, league: m.fix.league.name, compl: m.completeness, lineups: m.lineups, lowData: m.completeness < o.minCompl, marketLed: !!m.marketLed, exp: SC.expOf(r.key, m.sum) });
    const singles = [], suspicious = [], priced = [], pool = [], bbAll = [], feed = [];
    for (const m of ok) {
      const enabled = (m.rows || []).filter((r) => keyOn(r.key));
      const rows = enabled.filter((r) => r.eligible && !r.trivial);
      const val = rows.filter((r) => SC.passSingle(r, o));
      // too good to be true: listed (never used) so the user sees what was thrown away
      suspicious.push(...val.filter((r) => r.suspicious || (PB && r.ev > P.maxEdge)).map((r) => tag(r, m)));
      // quotes that disagree with the market's own 1X2 are listed as suspicious (never used)
      suspicious.push(...enabled.filter((r) => r.incoherent && r.price >= SC.MIN_SINGLE && r.ev >= o.minEdge).map((r) => tag(r, m)));
      const good = val.filter((r) => !r.suspicious && !(PB && r.ev > P.maxEdge));
      feed.push(...good.map((r) => tag(r, m)));
      pickDistinct(good.filter((r) => r.group !== 'combo'), o.perMatch, score).forEach((r) => singles.push(tag(r, m)));
      pickDistinct(good.filter((r) => r.group === 'combo'), 1, score).forEach((r) => priced.push(tag(r, m)));
      if (m.completeness >= o.minCompl) {
        const lo = Math.max(SC.MIN_LEG, o.oMin), hi = o.oMax;
        const legOk = PB
          ? (r) => r.group !== 'combo' && r.price >= lo && r.price <= hi && r.p >= Math.max(P.minLegP, mp) && r.ev >= o.minEdge && r.ev <= P.maxEdge && !r.suspicious
          : (r) => r.group !== 'combo' && r.price >= lo && r.price <= hi && r.p >= mp && r.evCons >= 0 && r.pCons >= o.minLegP && !r.suspicious;
        pickDistinct(rows.filter(legOk), 2, score).forEach((r) => pool.push(tag(r, m)));
        if (o.en.combos) {
          (m.builders || []).filter((b) => b.legs.every((l) => keyOn(l.key)) && (PB ? b.p >= Math.max(P.minBuilderP, 0.7 * mp) && b.evEst >= 0 : b.evEst > 0 && b.p >= 0.18))
            .sort(PB ? (a, b) => b.pCons - a.pCons : (a, b) => b.evEst - a.evEst).slice(0, 2)
            .forEach((b) => bbAll.push(Object.assign({}, b, { legs: b.legs.map((l) => Object.assign({}, l, { exp: SC.expOf(l.key, m.sum) })), mid: m.fix.id, ts: m.fix.ts, match: `${m.fix.home.name} – ${m.fix.away.name}`, league: m.fix.league.name, lineups: m.lineups, compl: m.completeness })));
        }
      }
    }
    singles.sort(bySc); priced.sort(bySc); feed.sort(bySc);

    // parlays: exactly 3 different matches, each leg >= 1.40
    const parlays = [];
    if (o.en.parlay) {
      const byM = new Map();
      pool.forEach((l) => { if (!byM.has(l.mid)) byM.set(l.mid, []); byM.get(l.mid).push(l); });
      const mids = [...byM.keys()], all = [];
      const maxOdds = PB ? P.maxParlayOdds : 14;
      for (let i = 0; i < mids.length; i++) for (let j = i + 1; j < mids.length; j++) for (let k = j + 1; k < mids.length; k++)
        for (const a of byM.get(mids[i])) for (const b of byM.get(mids[j])) for (const c of byM.get(mids[k])) {
          const odds = a.price * b.price * c.price, p = a.p * b.p * c.p, pc = a.pCons * b.pCons * c.pCons;
          if (odds > maxOdds) continue;
          all.push({ legs: [a, b, c], odds, p, pCons: pc, ev: p * odds - 1, evCons: pc * odds - 1 });
        }
      all.sort(PB ? (a, b) => b.pCons - a.pCons : byEvCons);   // probable mode: the parlay most likely to come through first
      for (const c of all) {
        if (PB ? c.ev < 0 : c.evCons <= 0) { if (PB) continue; break; }
        const share = (x) => x.legs.filter((l) => c.legs.some((q) => q.mid === l.mid && q.key === l.key)).length;
        if (parlays.some((x) => share(x) > 1)) continue;
        parlays.push(c);
        if (parlays.length >= 3) break;
      }
    }

    // builders: priced combos + free-form ones, one per match
    const builders = [];
    const seenM = new Set();
    const bbCands = priced.map((r) => ({ kind: 'real', mid: r.mid, ts: r.ts, match: r.match, league: r.league, label: r.label, p: r.p, pCons: r.pCons, price: r.price, fair: r.fair, minOdds: r.minOdds, evCons: r.evCons, ev: r.ev, lineups: r.lineups, book: r.book, bestOdds: r.bestOdds, lowData: r.lowData }))
      .concat(bbAll.map((b) => ({ kind: 'bb', mid: b.mid, ts: b.ts, match: b.match, league: b.league, legs: b.legs, p: b.p, pCons: b.pCons, price: b.est, fair: b.fair, minOdds: b.minOdds, naive: b.naive, evCons: b.evEst, ev: b.p * b.est - 1, lineups: b.lineups, indep: b.indep })));
    bbCands.sort(bySc);
    for (const b of bbCands) { if (seenM.has(b.mid)) continue; seenM.add(b.mid); builders.push(b); if (builders.length >= 5) break; }

    // allocation of the whole bankroll. One match may sit in at most 3 of the chosen bets (less correlated exposure).
    const items = [];
    // probable mode: stakes follow the probability (a likelier bet gets more); value mode: Kelly fraction
    const wOf = PB ? (pc) => Math.pow(Math.max(pc, 0.05), 3) : (pc, odds) => clamp(fk(pc, odds), 0.003, 0.25);
    const usedM = new Set(), expo = new Map();
    const can = (mids) => mids.every((m) => (expo.get(m) || 0) < 3);
    const take = (mids) => mids.forEach((m) => expo.set(m, (expo.get(m) || 0) + 1));
    for (const s of singles) { if (items.filter((x) => x.bucket === 'single').length >= 5) break; if (usedM.has(s.mid) || s.lowData) continue; usedM.add(s.mid); take([s.mid]); items.push({ bucket: 'single', kind: 'single', ref: s, w: wOf(s.pCons, s.price) }); }
    let np = 0;
    for (const p of parlays) { if (np >= 2) break; const mids = p.legs.map((l) => l.mid); if (!can(mids)) continue; take(mids); np++; items.push({ bucket: 'parlay', kind: 'parlay', ref: p, w: wOf(p.pCons, p.odds) }); }
    let nb = 0;
    for (const b of builders) { if (nb >= 2) break; if (b.lowData || !can([b.mid])) continue; take([b.mid]); nb++; items.push({ bucket: 'builder', kind: b.kind, ref: b, w: wOf(b.pCons, b.price) }); }
    // Kelly fractions are noisy when the model is slightly off, so the split inside a bucket is flattened towards equal stakes
    for (const bk of ['single', 'parlay', 'builder']) {
      const g = items.filter((x) => x.bucket === bk);
      if (!g.length) continue;
      const mean = g.reduce((t, x) => t + x.w, 0) / g.length;
      g.forEach((x) => { x.w = 0.5 + 0.5 * (x.w / mean); });
    }
    const prof = SC.PROFILES[o.profile] || SC.PROFILES.bal;
    const plan = SC.allocate(items, o.bankroll, { single: prof.single, parlay: prof.parlay, builder: prof.builder }, 5);
    const stats = { bets: plan.length, evCons: 0, ev: 0, top: 0, expHits: 0 };
    for (const it of plan) {
      const r = it.ref, odds = it.kind === 'parlay' ? r.odds : r.price, pc = r.pCons, p = r.p;
      it.odds = odds; it.ret = it.stake * odds;
      it.evUsd = it.stake * (pc * odds - 1);
      stats.evCons += it.evUsd; stats.ev += it.stake * (p * odds - 1); stats.top = Math.max(stats.top, it.stake); stats.expHits += p;
    }
    plan.sort((a, b) => ({ single: 0, parlay: 1, builder: 2 }[a.bucket] - { single: 0, parlay: 1, builder: 2 }[b.bucket]) || b.stake - a.stake);
    return { singles, feed: feed.slice(0, 150), parlays, builders, suspicious, plan, stats, bankroll: o.bankroll, profile: o.profile, mode: o.mode, counts: { ok: ok.length, noOdds: matches.filter((m) => m.status === 'ok' && m.noOdds).length, skipped: matches.filter((m) => m.status !== 'ok').length } };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = SC; else root.SimScan = SC;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
'use strict';
/* "Προσομοίωση" tab: daily schedule → pick a match → fresh data pull → Monte-Carlo simulation → betting analysis. */
(function () {
  const S = window.Sim, MK = window.SimMarkets, BD = window.SimBuild, D = window.SimData;

  const BIG = new Set([39, 40, 41, 45, 48, 140, 141, 135, 136, 78, 79, 61, 62, 2, 3, 848, 197, 198, 199, 203, 94, 88, 144, 179, 66, 81, 143, 137, 1, 4, 5, 6, 9, 10, 32, 33, 34, 35, 36, 37, 960, 961, 531, 556, 15, 16, 17, 18, 19, 20, 21, 29, 30, 31, 218, 207, 119, 103, 113, 244, 235, 106, 345, 210, 71, 128, 253, 262]);

  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

  const cfg = Object.assign({ depth: 'deep', nSim: 20000, blendW: 30, bankroll: 449, minEdge: 4, filter: 'big' }, LS('lbd_sim', {}));
  const st = {
    day: athensDay(), fixtures: null, loadingDay: false, dayErr: null, q: '', fix: null, ctx: null, build: null, R: null, markets: null,
    tasks: [], busy: false, progress: 0, note: '', err: null, tab: 'tips', onlyOdds: false, runId: 0, mkOpen: {},

  let recompTimer = null;

  // ------------------------------------------------ schedule
  async function loadDay(force) {

  function dayChips() {

  }
  function statusOf(f) {
    const s = f.status || {};

    if (['FT', 'AET', 'PEN'].includes(s.short)) return `<span class="sx-fin">${f.goals.h}-${f.goals.a}</span>`;
    if (['PST', 'CANC', 'ABD', 'SUSP', 'AWD', 'WO'].includes(s.short)) return `<span class="sx-time">${esc(s.short)}</span>`;
    return `<span class="sx-live">${s.short === 'HT' ? 'HT' : (s.elapsed || 0) + "'"} ${f.goals.h ?? 0}-${f.goals.a ?? 0}</span>`;
  }
  function renderSchedule() {
    const box = $('#sxSched');
    if (!box) return;
    let list = st.fixtures || [];
    const tracked = new Set(LS('lbd_tracked', []));
    const q = st.q.trim().toLowerCase();
    let big = list.filter((f) => BIG.has(f.league.id));
    if (cfg.filter === 'big') list = big.length ? big : list;
    else if (cfg.filter === 'star') list = list.filter((f) => tracked.has(f.id));
    if (q) list = (st.fixtures || []).filter((f) => (f.home.name + ' ' + f.away.name + ' ' + f.league.name + ' ' + f.league.country).toLowerCase().includes(q));
    const groups = new Map();
    for (const f of list) { const k = f.league.id; if (!groups.has(k)) groups.set(k, { l: f.league, items: [] }); groups.get(k).items.push(f); }
    const arr = [...groups.values()].sort((a, b) => (BIG.has(b.l.id) ? 1 : 0) - (BIG.has(a.l.id) ? 1 : 0) || a.l.country.localeCompare(b.l.country) || a.l.name.localeCompare(b.l.name));
    const nScan = D.hasKey() && st.fixtures ? scanCandidates().length : 0;
    let h = (D.hasKey() ? `<div class="sx-btns" style="margin:0 0 10px"><button class="primary" data-sx="scanopen">🔎 Σάρωση ημέρας — βρες τα καλύτερα στοιχήματα</button>${st.fixtures ? `<span class="muted sx-small">${nScan} αγώνες δεν έχουν ξεκινήσει${sc.out && !sc.open ? ' · υπάρχει αποθηκευμένη σάρωση ' + ago(sc.at) : ''}</span>` : ''}</div>` : '') + `<div class="seg" id="sxDays">${dayChips()}</div>

      <div class="seg"><button class="tabbtn${cfg.filter === 'big' ? ' on' : ''}" data-sx="filter" data-f="big">Μεγάλες λίγκες</button><button class="tabbtn${cfg.filter === 'all' ? ' on' : ''}" data-sx="filter" data-f="all">Όλες</button><button class="tabbtn${cfg.filter === 'star' ? ' on' : ''}" data-sx="filter" data-f="star">★ Αγαπημένα</button></div>`;

    for (const g of arr) {

    }

  }

  // ------------------------------------------------ controls card
  function renderControls() {
    const box = $('#sxCtl');
    if (!box) return;
    box.innerHTML = `<h2>Ρυθμίσεις προσομοίωσης</h2>
      <div class="sx-grid">
        <label>Βάθος δεδομένων<select id="cfgDepth"><option value="light"${cfg.depth === 'light' ? ' selected' : ''}>Ελαφρύ (~8 κλήσεις)</option><option value="normal"${cfg.depth === 'normal' ? ' selected' : ''}>Κανονικό (~18)</option><option value="deep"${cfg.depth === 'deep' ? ' selected' : ''}>Βαθύ (~45)</option></select></label>
        <label>Προσομοιώσεις<select id="cfgN"><option value="8000"${cfg.nSim === 8000 ? ' selected' : ''}>8.000 (γρήγορο)</option><option value="20000"${cfg.nSim === 20000 ? ' selected' : ''}>20.000</option><option value="50000"${cfg.nSim === 50000 ? ' selected' : ''}>50.000 (πιο σταθερό)</option></select></label>
        <label>Βάρος αγοράς: <b id="cfgBlendV">${cfg.blendW}%</b><input type="range" id="cfgBlend" min="0" max="100" step="5" value="${cfg.blendW}"></label>
        <label>Bankroll ($)<input type="number" id="cfgBank" min="0" step="10" value="${cfg.bankroll}"></label>

  }

  // ------------------------------------------------ run
  async function pick(id) {
    const f = (st.fixtures || []).find((x) => x.id === id);
    if (!f) return;
    st.fix = f; renderSchedule();
    st.adj = { disabled: {}, manual: { hAtt: 0, hDef: 0, aAtt: 0, aDef: 0 }, neutral: false, derby: false, playerOverride: {}, start: null };
    await runMatch(false);
    const m = $('#sxMatch'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function runMatch(force) {
    const my = ++st.runId;
    const fix = st.fix;
    st.ctx = null; st.build = null; st.R = null; st.markets = null; st.err = null; st.tasks = []; st.busy = true; st.progress = 0; st.note = ''; st.bt = null;
    renderMatch();
    try {
      if (!D.hasKey()) throw new Error('Βάλε πρώτα το κλειδί API-Football στις Ρυθμίσεις.');
      await D.quota();
      let depth = cfg.depth;
      const rem = D.state.remaining;
      if (rem != null) {
        if (rem < D.estimate('light') + 5) throw new Error(`Έμειναν μόνο ${rem} κλήσεις API σήμερα — δεν αρκούν.`);
        if (rem < D.estimate(depth) + 25) {
          const down = rem >= D.estimate('normal') + 25 ? 'normal' : 'light';
          if (down !== depth) { st.note = `Έμειναν ${rem} κλήσεις API σήμερα, οπότε χρησιμοποιώ ${down === 'normal' ? 'κανονικό' : 'ελαφρύ'} βάθος.`; depth = down; }
        }
      }
      const ctx = await D.loadMatch(fix, { depth, force, onLate: (c) => { if (my === st.runId && st.ctx === c) { if (st.tab === 'news') refreshTab(); saveCtx(); } }, onTask: (t) => { if (my !== st.runId) return; const i = st.tasks.findIndex((x) => x.id === t.id); if (i >= 0) st.tasks[i] = Object.assign({}, t); else st.tasks.push(Object.assign({}, t)); renderProgress(); } });
      if (my !== st.runId) return;
      st.ctx = ctx; st.depthUsed = depth;
      await recompute(my);
    } catch (e) { st.err = e.message || String(e); st.busy = false; renderMatch(); }
  }
  function buildOpts() {
    return { halfLife: 100, neutral: st.adj.neutral, derby: st.adj.derby, disabled: st.adj.disabled, manual: st.adj.manual, playerOverride: st.adj.playerOverride, blendW: cfg.blendW / 100, start: st.adj.start };
  }
  async function recompute(my) {
    my = my || st.runId;
    st.busy = true; st.progress = 0; renderMatch();
    const b = BD.run(st.ctx, buildOpts());
    if (b.error) { st.err = b.error; st.busy = false; renderMatch(); return; }
    st.build = b;
    const R = await S.simulate(b.params, { n: cfg.nSim, seed: 20261102 + st.seed, onProgress: (p) => { if (my === st.runId) { st.progress = p; const bar = $('#sxProg'); if (bar) bar.style.width = (p * 100).toFixed(0) + '%'; } } });
    if (my !== st.runId) return;
    st.R = R; st.markets = MK.markets(R, { h: st.ctx.fixture.home.name, a: st.ctx.fixture.away.name });

  }
  function scheduleRecompute() { clearTimeout(recompTimer); recompTimer = setTimeout(() => recompute(), 350); }

  function renderProgress() {

  function renderMatch() {

  function resultsHtml(names) {

        <div><span>Πέναλτι / κόκκινη</span><b>${pc(by['pen:yes'].p)} / ${pc(by['red:yes'].p)}</b></div>
      </div>
      <div class="muted sx-small">Εκτίμηση γκολ (λ): βάση ${l.base.lh.toFixed(2)}–${l.base.la.toFixed(2)} → μετά από παράγοντες ${l.afterFactors.lh.toFixed(2)}–${l.afterFactors.la.toFixed(2)}${Math.abs(l.final.lh - l.afterFactors.lh) > 0.005 ? ` → μετά την αγορά ${l.final.lh.toFixed(2)}–${l.final.la.toFixed(2)}` : ''}.

      ${b.lowData && b.lowData.length ? `<div class="sx-lowdata"><b>Γιατί η εκτίμηση είναι λιγότερο αξιόπιστη:</b><ul>${b.lowData.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${ctx.apiPred ? `<div class="muted sx-small">Δεύτερη γνώμη API-Football: ${pc(ctx.apiPred.home)}/${pc(ctx.apiPred.draw)}/${pc(ctx.apiPred.away)}${ctx.apiPred.advice ? ' · ' + esc(ctx.apiPred.advice) : ''}</div>` : ''}
      ${b.blend && b.blend.market ? `<div class="muted sx-small">${b.blend.src === 'api' ? 'Πρόβλεψη API-Football' : 'Αγορά (χωρίς περιθώριο)'}: ${pc(b.blend.market.h)}/${pc(b.blend.market.d)}/${pc(b.blend.market.a)} · καθαρό μοντέλο: ${pc(b.blend.pure.h)}/${pc(b.blend.pure.d)}/${pc(b.blend.pure.a)}</div>` : '<div class="muted sx-small">Δεν υπάρχουν ακόμα αποδόσεις: το αποτέλεσμα βασίζεται μόνο στο μοντέλο.</div>'}
      <div class="sx-btns"><button class="primary" data-sx="watch">🎮 Δες τον αγώνα</button><button data-sx="likely">🎯 Πιθανότερο σενάριο (${lk.h}-${lk.a})</button><button data-sx="reseed">🎲 Νέα προσομοίωση</button><button data-sx="rerun">↻ Ανανέωση δεδομένων &amp; επανάληψη</button></div>
      <p class="note">Στατιστική εκτίμηση, όχι εγγύηση κέρδους και όχι χρηματοοικονομική συμβουλή. Έλεγξε την πραγματική απόδοση πριν στοιχηματίσεις και παίξε μόνο ό,τι αντέχεις να χάσεις.</p></section>`;
    h += `<div class="seg sx-tabs">${[['tips', '💡 Προτάσεις'], ['pm', '🎯 Πιθανότητες'], ['mk', '📊 Αγορές'], ['fac', '⚙ Παράγοντες'], ['charts', '📈 Γραφήματα'], ['news', '📰 Νέα'], ['data', '🔎 Δεδομένα']].map(([k, t]) => `<button class="tabbtn${st.tab === k ? ' on' : ''}" data-sx="tab" data-t="${k}">${t}</button>`).join('')}</div>`;
    h += `<section class="card" id="sxTabBody">${tabBody()}</section>`;
    return h;
  }

  // ------------------------------------------------ tab: tips (value / probable)
  const FAM = (k) => k.split(':').slice(0, k.startsWith('ou') || k.startsWith('co') || k.startsWith('cd') || k.startsWith('tt') || k.startsWith('ht_ou') ? 2 : 1).join(':');
  /* expected value of the underlying stat (goals / corners / cards) for the match that is open */
  function matchExp(key) {
    const m = st.R && st.R.mean;
    if (!m || !window.SimScan.expOf) return '';
    const e = window.SimScan.expOf(key, { xh: m.hg, xa: m.ag, corners: m.coH + m.coA, cards: m.yH + m.yA + m.rH + m.rA, coh: m.coH, coa: m.coA, cdh: m.yH + m.rH, cda: m.yA + m.rA });
    return e ? ` <span class="sc-exp">αναμενόμενα <b>${e.v.toFixed(1)}</b> ${e.u}</span>` : '';
  }
  function tipsHtml() {
    const ctx = st.ctx, b = st.build, mk = st.markets;
    const best = (ctx.odds && ctx.odds.best) || {};
    const have = Object.keys(best).length > 0;
    const coh = MK.coherence(S, ctx.odds && ctx.odds.consensus, mk, best, { tol: 0.15, price: (x) => (x.n >= 3 ? x.med : x.o) });
    const rows = MK.evaluate(mk, best, { minEdge: cfg.minEdge / 100, bankroll: cfg.bankroll, unc: b.unc, coh, bad: coh.bad });
    const PB = scanCfg.mode !== 'value', SCN = window.SimScan, floor = scanEdge();
    // probable mode: the most likely bets that are realistic (a real line, price >= 1.30) and not priced below the model's fair price; ranked by probability
    const value = PB
      ? (() => { const seen = new Set(), out = []; for (const r of rows.filter((x) => x.eligible && !SCN.isTrivial(x.key) && !x.key.startsWith('cmb:') && x.p >= SCN.PROB.minP && x.ev >= floor && x.ev <= SCN.PROB.maxEdge).sort((x, y) => y.p - x.p)) { const f = FAM(r.key); if (seen.has(f)) continue; seen.add(f); out.push(r); if (out.length >= 6) break; } return out; })()
      : rows.filter((r) => r.value).slice(0, 8);
    let h = PB ? '<h2>Πιθανότερα στοιχήματα με απόδοση</h2>' : '<h2>Value σε σχέση με τις αποδόσεις</h2>';
    if (coh.bad.size) h += `<div class="sx-lowdata"><b>⚠ Αγνοήθηκαν τιμές που δεν συμβαδίζουν με την αγορά</b> (πιθανό λάθος γραμμής ή παλιά τιμή — έλεγξέ τες χειροκίνητα στο bookmaker πριν παίξεις):<ul>${[...coh.bad].map((k) => { const r = rows.find((x) => x.key === k), ci = coh.info[k]; return `<li>${esc(r ? r.label : k)} @ ${od(ci.price)} — η αγορά 1Χ2 δίνει δίκαιη απόδοση περίπου ${od(ci.fair)}</li>`; }).join('')}</ul></div>`;
    if (!have) h += '<p class="muted">Οι αποδόσεις δεν έχουν ανοίξει ακόμα για αυτόν τον αγώνα. Δες παρακάτω τις πιθανότερες αγορές με την ελάχιστη απόδοση που αξίζει.</p>';
    else if (!value.length) h += PB ? '<p class="muted">Δεν βρέθηκε αγορά με πιθανότητα ≥ 50%, απόδοση ≥ 1.30 και τιμή όχι κάτω από τη δίκαιη. Και αυτή είναι απάντηση: δεν έχει κάθε αγώνας καλή πρόταση.</p>' : `<p class="muted">Δεν βρέθηκε αγορά με απόδοση ≥ 1.30 και edge ≥ ${cfg.minEdge}% μετά από το περιθώριο ασφαλείας (${pc(b.unc, 1)} στην πιθανότητα). Και αυτή είναι απάντηση: δεν έχει κάθε αγώνας value.</p>`;
    for (const r of value) {
      h += `<div class="pick value"><div class="big">${esc(r.label)} @ ${od(r.odds)} <span class="muted">(${esc(r.book)})</span>${matchExp(r.key)}</div>
        <div class="m">${PB ? 'Πιθανότητα' : 'Μοντέλο'} <b>${pc(r.p, 1)}</b> · δίκαιη απόδοση ${od(r.fair)} · edge <b class="pos">+${(r.ev * 100).toFixed(1)}%</b> · ελάχιστη απόδοση που αξίζει ${od(r.minOdds)} · μέση αγορά ${od(r.med)} (${r.nBooks} bookmakers)</div>
        ${PB ? '' : `<div class="m">Προτεινόμενο μέγεθος (¼ Kelly, όριο 3%): <b>${(r.kellyPct * 100).toFixed(1)}%</b> του bankroll${cfg.bankroll ? ' ≈ <b>$' + (r.kellyPct * cfg.bankroll).toFixed(2) + '</b>' : ''} — μαθηματικός υπολογισμός, την απόφαση την παίρνεις εσύ.</div>`}
        ${r.ev > 0.2 ? '<div class="m neg">⚠ Πολύ μεγάλο edge (&gt;20%). Συνήθως σημαίνει ότι το μοντέλο δεν ξέρει κάτι (τραυματίας, αλλαγή ενδεκάδας, παλιά απόδοση) και όχι ότι η αγορά έκανε λάθος. Έλεγξε τα νέα και την ενδεκάδα πριν το εμπιστευτείς.</div>' : ''}</div>`;
    }
    // probable markets with the minimum playable odds
    const cand = mk.filter((m) => m.p >= 0.55 && m.p <= (PB ? 0.80 : 0.93) && !(PB && SCN.isTrivial(m.key)) && !/^(tg|oe|fg:none|late|g30|co:1x2|dnb)/.test(m.key) && !/^htft/.test(m.key)).sort((x, y) => y.p - x.p);
    const seen = new Set(), pick = [];
    for (const m of cand) { const fam = FAM(m.key); if (seen.has(fam)) continue; seen.add(fam); pick.push(m); if (pick.length >= 8) break; }
    h += '<h2 style="margin-top:14px">Πιθανότερες αγορές &amp; ελάχιστη απόδοση</h2>';
    h += pick.map((m) => {
      const fair = m.type === 'push' ? (1 - (m.pp || 0)) / m.p : 1 / m.p, minO = fair * 1.06, bo = best[m.key];
      let verdict = '';
      if (bo) verdict = bo.o >= Math.max(minO, 1.3) ? `<span class="pos">αγορά ${od(bo.o)} ✓ αρκεί</span>` : `<span class="neg">αγορά ${od(bo.o)} — χαμηλότερη από την ελάχιστη</span>`;
      return `<div class="pick"><div class="big">${esc(m.label)} — ${pc(m.p)}${matchExp(m.key)}</div><div class="m">Δίκαιη ${od(fair)} · αξίζει μόνο από <b>${od(minO)}</b>${minO < 1.3 ? ' (κάτω από 1.30)' : ''} ${verdict}</div></div>`;
    }).join('') || '<p class="muted">Καμία αγορά δεν ξεχωρίζει καθαρά.</p>';
    // same-match combos with odds
    const cmb = (PB ? rows.filter((r) => r.key.startsWith('cmb:') && r.eligible && r.p >= SCN.PROB.minComboP && r.ev >= floor && r.ev <= SCN.PROB.maxEdge).sort((x, y) => y.p - x.p) : rows.filter((r) => r.key.startsWith('cmb:') && r.eligible).sort((x, y) => y.ev - x.ev)).slice(0, 4);
    if (cmb.length) {
      h += '<h2 style="margin-top:14px">Συνδυαστικά ίδιου αγώνα (με τη συσχέτιση του μοντέλου)</h2>' + cmb.map((r) => `<div class="pick"><div class="big">${esc(r.label)} @ ${od(r.odds)}</div><div class="m">Μοντέλο ${pc(r.p, 1)} · δίκαιη ${od(r.fair)} · ${r.ev >= 0 ? '<span class="pos">+' : '<span class="neg">'}${(r.ev * 100).toFixed(1)}%</span></div></div>`).join('');
    }
    return h;
  }

  // ------------------------------------------------ tab: all markets
  function marketsHtml() {
    const best = (st.ctx.odds && st.ctx.odds.best) || {};
    const coh = MK.coherence(S, st.ctx.odds && st.ctx.odds.consensus, st.markets, best, { tol: 0.15, price: (x) => (x.n >= 3 ? x.med : x.o) });
    const rows = MK.evaluate(st.markets, best, { minEdge: cfg.minEdge / 100, bankroll: cfg.bankroll, unc: st.build.unc, coh, bad: coh.bad });
    const rb = Object.fromEntries(rows.map((r) => [r.key, r]));
    let h = `<label class="sx-chk"><input type="checkbox" id="sxOnlyOdds"${st.onlyOdds ? ' checked' : ''}> Μόνο αγορές με απόδοση</label>`;
    for (const [g, name] of Object.entries(MK.GROUPS)) {
      const list = st.markets.filter((m) => m.group === g && (!st.onlyOdds || rb[m.key]));
      if (!list.length) continue;
      h += `<details class="sx-det" data-g="${g}"${st.mkOpen[g] || g === 'ft' ? ' open' : ''}><summary><b>${name}</b> <span class="muted">(${list.length})</span></summary><table class="sx-tbl"><thead><tr><th>Αγορά</th><th>Π%</th><th>Δίκαιη</th><th>Απόδοση</th><th>Edge</th></tr></thead><tbody>`;
      for (const m of list) {
        const r = rb[m.key], fair = m.type === 'push' ? (1 - (m.pp || 0)) / m.p : 1 / m.p;
        h += `<tr class="${r && r.value ? 'val' : ''}"><td>${esc(m.label)}</td><td>${pc(m.p, m.p < 0.1 ? 1 : 0)}</td><td>${od(fair)}</td><td>${r ? od(r.odds) + (r.incoherent ? ' <span class="neg" title="Δεν συμβαδίζει με την αγορά 1Χ2">⚠</span>' : '') : '—'}</td><td>${r ? (r.incoherent ? '<span class="neg">ύποπτη τιμή</span>' : `<span class="${r.ev >= 0 ? 'pos' : 'neg'}">${r.ev >= 0 ? '+' : ''}${(r.ev * 100).toFixed(1)}%</span>`) : ''}</td></tr>`;
      }
      h += '</tbody></table></details>';
    }
    const sc = MK.topScores(st.R, 8);
    h += `<details class="sx-det"><summary><b>Ακριβές σκορ</b></summary><table class="sx-tbl"><tbody>${sc.map((x) => `<tr><td>${x.h}-${x.a}</td><td>${pc(x.p, 1)}</td><td>${od(1 / x.p)}</td></tr>`).join('')}</tbody></table></details>`;
    h += '<p class="note">Στις αγορές με επιστροφή (DNB, χάντικαπ με ακέραιο) η δίκαιη απόδοση υπολογίζεται χωρίς τις περιπτώσεις επιστροφής. Οι κάρτες μετράνε κίτρινες + κόκκινες.</p>';
    return h;
  }

  // ------------------------------------------------ tab: factors
  function factorsHtml() {
    const b = st.build, f = st.ctx.fixture, m = st.adj.manual;
    const eff = (x) => (Math.abs(x - 1) < 0.0005 ? '<span class="muted">0%</span>' : `<span class="${x > 1 ? 'pos' : 'neg'}">${x > 1 ? '+' : '−'}${Math.abs((x - 1) * 100).toFixed(1)}%</span>`);
    const dots = (c) => '●'.repeat(Math.max(1, Math.round(c * 4))) + '○'.repeat(4 - Math.max(1, Math.round(c * 4)));
    let h = '<p class="note" style="margin-top:0">Κάθε παράγοντας αλλάζει τα αναμενόμενα γκολ (λ). Απενεργοποίησε όποιον δεν εμπιστεύεσαι και η προσομοίωση ξανατρέχει αμέσως.</p>';
    for (const x of b.factors) {
      h += `<div class="sx-fac${x.on ? '' : ' off'}"><div class="sx-fh">${x.locked ? '<span class="sx-lock">🔒</span>' : `<input type="checkbox" data-sx="fac" data-id="${x.id}"${x.on ? ' checked' : ''}>`}<b>${esc(x.label)}</b><span class="sx-eff">${esc(f.home.name.split(' ')[0])} ${eff(x.effH)} · ${esc(f.away.name.split(' ')[0])} ${eff(x.effA)}</span><span class="sx-conf" title="Βεβαιότητα">${dots(x.conf)}</span></div><div class="muted sx-small">${esc(x.detail)}</div>`;
      if (x.players) {
        for (const side of ['home', 'away']) {
          for (const p of x.players[side]) {
            const ov = p.override;
            h += `<div class="sx-pl"><span>${esc(p.name)} <span class="muted">(${esc(f[side].name)} · ${p.pos}${p.w < 1 ? ' · αμφίβολος' : ''}${p.goals ? ' · ' + p.goals + ' γκολ' : ''})</span></span><span><button class="mini${p.w >= 1 ? ' on' : ''}" data-sx="pl" data-id="${p.id}" data-v="out">Εκτός</button><button class="mini${p.w === 0 ? ' on' : ''}" data-sx="pl" data-id="${p.id}" data-v="in">Παίζει</button></span></div>`;
          }
        }
      }
      h += '</div>';
    }
    h += `<div class="sx-fac"><div class="sx-fh"><b>Δικές σου διορθώσεις (what-if)</b></div>
      ${[['hAtt', 'Επίθεση ' + f.home.name], ['hDef', 'Άμυνα ' + f.home.name], ['aAtt', 'Επίθεση ' + f.away.name], ['aDef', 'Άμυνα ' + f.away.name]].map(([k, lab]) => `<label class="sx-rng">${esc(lab)}: <b id="m_${k}">${m[k] > 0 ? '+' : ''}${m[k]}%</b><input type="range" min="-25" max="25" step="1" value="${m[k]}" data-sx="man" data-k="${k}"></label>`).join('')}
      <label class="sx-chk"><input type="checkbox" data-sx="neutral"${st.adj.neutral ? ' checked' : ''}> Ουδέτερο γήπεδο</label>
      <label class="sx-chk"><input type="checkbox" data-sx="derby"${st.adj.derby ? ' checked' : ''}> Ντέρμπι / υψηλή ένταση (περισσότερες κάρτες)</label>
      <div class="sx-row2"><label>Ξεκίνα από λεπτό <input type="number" id="stMin" min="0" max="89" value="${st.adj.start ? st.adj.start.minute : 0}" style="width:64px"></label><label>σκορ <input type="number" id="stH" min="0" max="9" value="${st.adj.start ? st.adj.start.hg : 0}" style="width:54px"> – <input type="number" id="stA" min="0" max="9" value="${st.adj.start ? st.adj.start.ag : 0}" style="width:54px"></label><button data-sx="start">Εφαρμογή</button></div>
      <p class="note">Η επιλογή «Ξεκίνα από λεπτό» υπολογίζει το υπόλοιπο ενός αγώνα που ήδη εξελίσσεται (0 = πριν τον αγώνα). <button class="mini" data-sx="resetadj">Μηδενισμός διορθώσεων</button></p></div>`;
    return h;
  }

  // ------------------------------------------------ tab: charts
  function chartsHtml() {
    const R = st.R, f = st.ctx.fixture;
    let h = '<h2>Κατανομή σκορ (γηπεδούχος κάθετα · φιλοξενούμενος οριζόντια)</h2><div class="sx-scroll"><table class="sx-heat"><thead><tr><th></th>' + [0, 1, 2, 3, 4, 5].map((j) => `<th>${j}</th>`).join('') + '</tr></thead><tbody>';
    const W = R.GM + 1;
    let mx = 0; for (let i = 0; i <= 5; i++) for (let j = 0; j <= 5; j++) mx = Math.max(mx, R.mat[i * W + j]);
    for (let i = 0; i <= 5; i++) {
      h += `<tr><th>${i}</th>`;
      for (let j = 0; j <= 5; j++) { const p = R.mat[i * W + j]; h += `<td style="background:rgba(79,140,255,${(p / mx * 0.85).toFixed(2)})">${(p * 100).toFixed(1)}</td>`; }

    const hist = (arr, from, to, line) => { const m = Math.max(...arr.slice(from, to + 1)); return arr.slice(from, to + 1).map((p, i) => `<div class="sx-bar"><span>${from + i}</span><div><i class="${from + i > line ? 'h' : 'a'}" style="width:${(p / m) * 90}%"></i></div><span>${pc(p, 1)}</span></div>`).join(''); };
    h += `<h2 style="margin-top:14px">Κόρνερ συνολικά (μέσος όρος ${(R.mean.coH + R.mean.coA).toFixed(1)})</h2>${hist(R.coT, 4, 17, 9.5)}<p class="note">Μπλε = πάνω από 9.5.</p>`;
    h += `<h2 style="margin-top:14px">Κάρτες συνολικά (κίτρινες+κόκκινες)</h2>${hist(R.cdT, 0, 9, 3.5)}<p class="note">Μπλε = πάνω από 3.5 κάρτες.</p>`;
    return h;
  }

  // ------------------------------------------------ tab: news
  const HOT = /(τραυματ|απουσ|ενδεκάδ|τιμωρ|αμφίβολ|injur|lineup|line-up|suspen|doubt|ruled out|miss|out for)/i;
  function newsHtml() {

    else if (!ctx.news) h += '<p class="muted">Δεν βρέθηκαν νέα ή η πηγή δεν απάντησε στην ώρα της (δωρεάν πάροχος, χαμηλή αξιοπιστία). Πάτα «Ξανά», ή άνοιξε τους συνδέσμους παρακάτω και πρόσθεσε ό,τι βρεις ως διόρθωση στην καρτέλα «Παράγοντες».</p>';
    if (!loading) h += '<div class="sx-btns"><button data-sx="retrynews">↻ Ξανά τα νέα</button></div>';

      else if (!loading) h += '<p class="muted sx-small">Κανένας τίτλος.</p>';
      h += `<a class="sx-link" href="${D.newsLink(team)}" target="_blank" rel="noopener">Άνοιγμα ειδήσεων για ${esc(team)} ↗</a>`;

  }

  // ------------------------------------------------ day scanner: every match of the day that has not started → best bets
  const scanCfg = Object.assign({ depth: 'auto', scope: null, bank: 300, profile: 'bal', minEdge: 3, minEdgeP: 0, mode: 'prob', minP: null, oMin: 1.3, oMax: 3.5, lgOff: [], sort: 'prob', presets: {}, presetSel: '', pmMin: 0, pmSort: 'time', pmRank: 'ou:2.5:over' }, cfg.scan || {});
  if (scanCfg.mode !== 'value') scanCfg.mode = 'prob';
  if (!['prob', 'ev', 'time'].includes(scanCfg.sort)) scanCfg.sort = 'prob';
  if (!Array.isArray(scanCfg.lgOff)) scanCfg.lgOff = [];
  if (!scanCfg.presets || typeof scanCfg.presets !== 'object') scanCfg.presets = {};
  /* mode 'prob' (default) = the most probable realistic bets; mode 'value' = the biggest edge. Each mode keeps its own minimum edge. */
  const scanEdge = () => Math.max(0, Number(scanCfg.mode === 'value' ? scanCfg.minEdge : scanCfg.minEdgeP) || 0) / 100;
  scanCfg.en = Object.assign({ goals: true, cards: true, corners: true, combos: true, parlay: true }, scanCfg.en || {});
  // older saved settings had a single switch for all the goal markets
  if (scanCfg.en.goals === false) { for (const k of ['res', 'ou', 'btts', 'team', 'ah']) scanCfg.en[k] = false; }
  scanCfg.en.goals = true;
  const scanOpts = () => ({ mode: scanCfg.mode, minEdge: scanEdge(), minP: scanCfg.minP === null || scanCfg.minP === '' || !isFinite(Number(scanCfg.minP)) ? null : Number(scanCfg.minP) / 100, oMin: Number(scanCfg.oMin) || 1.3, oMax: Number(scanCfg.oMax) || 3.5, lgOff: scanCfg.lgOff, bankroll: scanCfg.bank, profile: scanCfg.profile, en: scanCfg.en });
  /* ready-made settings; the user can also save his own under a name */
  const SCAN_PRESETS = {
    safe: { name: 'Ασφαλή (πιθανότητα ≥ 60%)', f: { mode: 'prob', minEdgeP: 0, minP: 60, oMin: 1.3, oMax: 1.9, sort: 'prob' } },
    bal: { name: 'Ισορροπημένα (πιθανότητα ≥ 50%)', f: { mode: 'prob', minEdgeP: 0, minP: 50, oMin: 1.3, oMax: 3.5, sort: 'prob' } },
    val: { name: 'Value (μεγαλύτερο edge)', f: { mode: 'value', minEdge: 3, minP: 25, oMin: 1.5, oMax: 3.5, sort: 'ev' } },
  };
  const PRESET_KEYS = ['mode', 'minEdge', 'minEdgeP', 'minP', 'oMin', 'oMax', 'sort'];
  function applyPreset(p) {
    PRESET_KEYS.forEach((k) => { if (p[k] !== undefined) scanCfg[k] = p[k]; });
    if (p.en) scanCfg.en = Object.assign({}, scanCfg.en, p.en);
    if (Array.isArray(p.lgOff)) scanCfg.lgOff = p.lgOff.slice();
  }
  function snapshotPreset() {
    const o = { en: Object.assign({}, scanCfg.en), lgOff: scanCfg.lgOff.slice() };
    PRESET_KEYS.forEach((k) => { o[k] = scanCfg[k]; });
    return o;
  }
  const sc = { open: false, view: 'setup', busy: false, cancel: false, recs: null, out: null, at: 0, depth: null, day: null, err: null };
  const saveScanCfg = () => { cfg.scan = scanCfg; save('lbd_sim', cfg); };
  const usd = (x) => '$' + Math.round(x).toLocaleString('en-US');
  const SEC_PER = { light: 6, normal: 10, deep: 18 };
  const DEPTH_NAME = { light: 'Ελαφρύ', normal: 'Κανονικό', deep: 'Βαθύ' };
  function dayLabel(d) { const dt = new Date(d + 'T12:00:00Z'); return d === athensDay() ? 'σήμερα' : `${WD[dt.getUTCDay()]} ${dt.getUTCDate()}/${dt.getUTCMonth() + 1}`; }
  const scanScope = () => scanCfg.scope || (cfg.filter === 'star' ? 'star' : cfg.filter === 'all' ? 'all' : 'big');
  function scanCandidates(keepAllLeagues) {
    const tracked = new Set(LS('lbd_tracked', []));
    const now = Date.now();
    let list = (st.fixtures || []).filter((f) => ['NS', 'TBD'].includes((f.status || {}).short) && f.ts > now + 3 * 60000);
    const scope = scanScope();
    if (scope === 'big') { const b = list.filter((f) => BIG.has(f.league.id)); if (b.length) list = b; }
    else if (scope === 'star') list = list.filter((f) => tracked.has(f.id));
    if (!keepAllLeagues) list = list.filter((f) => !scanCfg.lgOff.includes(f.league.id));      // leagues switched off are not even scanned (saves API calls)
    return list.sort((a, b) => a.ts - b.ts);
  }
  function scanPlan() {
    const cand = scanCandidates(), rem = D.state.remaining, per = (d) => D.estimate(d);
    let depth = scanCfg.depth;
    if (depth === 'auto') {
      const n = Math.max(1, cand.length);
      depth = rem == null ? (n <= 10 ? 'deep' : 'normal') : rem - 60 >= n * per('deep') ? 'deep' : rem - 60 >= n * per('normal') ? 'normal' : 'light';
    }
    const prio = (arr) => arr.slice().sort((a, b) => (BIG.has(b.league.id) ? 1 : 0) - (BIG.has(a.league.id) ? 1 : 0) || a.ts - b.ts);
    let fixtures = cand.slice(), cut = 0;
    if (rem != null) { const afford = Math.max(0, Math.floor((rem - 40) / per(depth))); if (afford < fixtures.length) { cut += fixtures.length - afford; fixtures = prio(fixtures).slice(0, afford); } }
    if (fixtures.length > 30) { cut += fixtures.length - 30; fixtures = prio(fixtures).slice(0, 30); }
    fixtures.sort((a, b) => a.ts - b.ts);
    return { cand, fixtures, depth, cut, rem, calls: fixtures.length * per(depth), minutes: Math.max(1, Math.round(fixtures.length * SEC_PER[depth] / 2 / 60)) };
  }
  async function openScan() {
    if (!D.hasKey()) return;

  function compileScan() {
    const now = Date.now();
    const live = (sc.recs || []).filter((r) => !(r.fix && r.fix.ts && r.fix.ts < now));
    try {
      sc.out = window.SimScan.compile(live, scanOpts());
      sc.out.started = (sc.recs || []).length - live.length;
    } catch (e) { sc.out = null; sc.err = 'Σφάλμα υπολογισμού: ' + e.message; }
  }
  async function runScan() {
    if (sc.busy) return;
    if (!D.hasKey()) { sc.err = 'Βάλε πρώτα το κλειδί API-Football.'; renderScan(); return; }
    await D.quota();
    const plan = scanPlan();
    if (!plan.fixtures.length) { sc.err = 'Δεν υπάρχουν αγώνες για σάρωση με αυτές τις ρυθμίσεις (όσοι δεν έχουν ξεκινήσει).'; renderScan(); return; }
    sc.err = null; sc.partial = null; sc.busy = true; sc.cancel = false; sc.view = 'run'; sc.depth = plan.depth; sc.day = st.day;
    sc.recs = plan.fixtures.map((f) => ({ fix: { id: f.id, ts: f.ts, league: { id: f.league.id, name: f.league.name, country: f.league.country }, home: { name: f.home.name }, away: { name: f.away.name } }, status: 'wait' }));
    renderScan();
    const o = { depth: plan.depth, nSim: Math.min(cfg.nSim, 15000), blendW: cfg.blendW / 100 };
    let recs;
    try {
      recs = await window.SimScan.run(plan.fixtures, o, { onUpdate: (i, rec) => { sc.recs[i] = rec; updateScanProgress(); persistScanSoon(); }, cancelled: () => sc.cancel });
    } catch (e) { sc.busy = false; sc.err = 'Η σάρωση απέτυχε: ' + (e.message || e); sc.view = 'setup'; renderScan(); return; }
    sc.recs = recs; sc.busy = false; sc.at = Date.now();
    compileScan(); persistScan();
    sc.view = 'res'; renderScan();
  }
  function persistScan(partial) {
    try {
      const slimRecs = (sc.recs || []).map((r) => ({ fix: r.fix, status: r.status, note: r.note, noOdds: r.noOdds, completeness: r.completeness, incoherent: r.incoherent, dataMode: r.dataMode, marketLed: r.marketLed, modelless: r.modelless, lowDataNotes: r.lowDataNotes, lineups: r.lineups, nBooks: r.nBooks, depth: r.depth, hasCorners: r.hasCorners, hasCards: r.hasCards, referee: r.referee, sum: r.sum, rows: (r.rows || []).filter((x) => x.eligible), builders: r.builders }));
      if (partial) localStorage.setItem('lbd_scan_p', JSON.stringify({ day: sc.day, at: Date.now(), depth: sc.depth, partial: true, recs: slimRecs }));
      else { localStorage.setItem('lbd_scan', JSON.stringify({ day: sc.day, at: sc.at, depth: sc.depth, recs: slimRecs })); localStorage.removeItem('lbd_scan_p'); }
    } catch {}
  }
  function restoreScan() {
    const good = (x) => x && Array.isArray(x.recs) && x.at && Date.now() - x.at <= 14 * 3600000;
    let o = LS('lbd_scan', null);
    const p = LS('lbd_scan_p', null), pDone = good(p) ? p.recs.filter((r) => r.status === 'ok').length : 0;

    if (pDone >= 3 && (!good(o) || p.at > o.at)) { o = p; sc.partial = { done: pDone, total: p.recs.length }; }

    sc.recs = o.recs; sc.at = o.at; sc.depth = o.depth; sc.day = o.day;
    compileScan();
  }

  // ------------------------------------------------ session memory
  /* A phone browser throws a page away from memory when you switch to another app / tab and reloads it on return,
     so everything the screen showed would be lost. We keep the day, the scan panel (and a half-finished scan), the open
     match with its already downloaded data (no new API calls), the selected tab and the scroll position. */
  const SESS_KEY = 'lbd_sess', CTX_KEY = 'lbd_ctx', SESS_MAX = 12 * 3600000;
  let sessData = null, wantY = null, lastCtxSig = '', sessT = null, scanSaveT = null;
  const loadSess = () => { const o = LS(SESS_KEY, null); return o && o.v === 1 && o.at && Date.now() - o.at < SESS_MAX ? o : null; };
  function saveSess() {
    if (wantY != null) return;            // still restoring: do not overwrite the saved position with 0
    try {
      localStorage.setItem(SESS_KEY, JSON.stringify({
        v: 1, at: Date.now(), day: st.day, y: Math.round(window.scrollY || 0), seed: st.seed,
        scan: { open: !!sc.open, view: sc.view },
        match: st.fix && st.ctx ? { id: st.fix.id, tab: st.tab, depth: st.depthUsed || null, adj: st.adj } : null,
      }));
    } catch {}
  }
  const touchSess = () => { clearTimeout(sessT); sessT = setTimeout(saveSess, 250); };
  function saveCtx() {
    if (!st.ctx || !st.fix) return;
    const sig = st.fix.id + ':' + (st.ctx.loadedAt || 0) + ':' + (st.ctx.news ? 1 : 0);
    if (sig === lastCtxSig) return;
    try { localStorage.setItem(CTX_KEY, JSON.stringify({ id: st.fix.id, at: Date.now(), ctx: st.ctx })); lastCtxSig = sig; }
    catch {
      // storage is full: free the oldest simulator caches (they are only a convenience) and try once more
      try {
        Object.keys(localStorage).filter((k) => k.startsWith('lbs:')).forEach((k) => localStorage.removeItem(k));
        localStorage.setItem(CTX_KEY, JSON.stringify({ id: st.fix.id, at: Date.now(), ctx: st.ctx })); lastCtxSig = sig;
      } catch {}
    }
  }
  function flushSess() { saveSess(); saveCtx(); if (sc.busy) persistScan(true); }
  /* a scan can take minutes: keep what is finished so far, so a reload does not throw it away */
  function persistScanSoon() { if (scanSaveT) return; scanSaveT = setTimeout(() => { scanSaveT = null; if (sc.busy) persistScan(true); }, 3000); }
  function restoreMatch(o) {
    const m = o && o.match, c = LS(CTX_KEY, null);
    if (!m || !c || c.id !== m.id || !c.ctx || !c.ctx.fixture || Date.now() - c.at > SESS_MAX) return false;
    st.fix = c.ctx.fixture; st.ctx = c.ctx; st.tab = m.tab || 'tips'; st.depthUsed = m.depth || st.depthUsed;

    lastCtxSig = st.fix.id + ':' + (st.ctx.loadedAt || 0) + ':' + (st.ctx.news ? 1 : 0);
    const my = ++st.runId;
    recompute(my).catch((e) => { st.err = e.message || String(e); st.busy = false; renderMatch(); });
    return true;
  }
  /* bring the screen back to where it was: the page height changes while lists load, so try a few times until the user touches the screen */
  function tryScroll() {
    if (wantY == null) return;
    window.scrollTo(0, wantY);
  }
  function startScrollRestore(y) {
    if (!(y > 40)) return;
    wantY = y;
    const stop = () => { wantY = null; ['touchstart', 'wheel', 'mousedown', 'keydown'].forEach((ev) => window.removeEventListener(ev, stop, true)); };
    ['touchstart', 'wheel', 'mousedown', 'keydown'].forEach((ev) => window.addEventListener(ev, stop, { capture: true, passive: true }));
    [0, 250, 700, 1500, 2800].forEach((ms) => setTimeout(tryScroll, ms));
    setTimeout(stop, 3500);
  }

  // ------------------------------------------------ mount
  let mounted = false, mountedScan = false;
  function mount() {
    const v = $('#viewSim');
    if (!v) return;
    if (!mounted) {
      v.innerHTML = '<section class="card" id="sxIntro"></section><section class="card" id="sxCtl"></section><section class="card"><h2>Πρόγραμμα αγώνων</h2><div id="sxSched"></div></section><div id="sxScan"></div><div id="sxMatch"></div>';
      v.addEventListener('click', onClick); v.addEventListener('change', onChange); v.addEventListener('input', onInput);
      mounted = true;
      sessData = loadSess();
      if (sessData && /^\d{4}-\d\d-\d\d$/.test(sessData.day || '')) st.day = sessData.day;
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSess(); });
      window.addEventListener('pagehide', flushSess);
      window.addEventListener('scroll', touchSess, { passive: true });
    }
    renderIntro();
    renderControls();
    let fresh = false;
    if (!mountedScan) {
      mountedScan = true; fresh = true; restoreScan();
      const so = sessData && sessData.scan;
      if (so && so.open && D.hasKey()) {
        sc.open = true; sc.view = sc.out ? (so.view === 'pm' ? 'pm' : 'res') : 'setup';
        if (sc.view === 'setup') D.quota().then(() => { if (sc.open && sc.view === 'setup') renderScan(); }).catch(() => {});
      }
    }
    renderScan();
    if (st.fixtures === null && !st.loadingDay && D.hasKey()) loadDay(false); else renderSchedule();
    renderMatch();
    if (fresh && sessData) {
      if (restoreMatch(sessData)) renderSchedule();
      startScrollRestore(sessData.y);
    }
  }
  window.SimUI = { render: mount, _st: st, _cfg: cfg };
})();

</script>
<script>
window.FORCE_DIRECT = true;
(function(){ function go(){ if (window.SimUI) window.SimUI.render(); } if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go(); })();
</script>
